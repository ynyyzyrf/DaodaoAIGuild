<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="龍蝦學院默認封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7fd"/>
      <stop offset="0.55" stop-color="#FBF0EC"/>
      <stop offset="1" stop-color="#fff8e6"/>
    </linearGradient>
    <radialGradient id="gSky" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bae6fd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gBrand" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E49A85" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#E49A85" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fcd34d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fcd34d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- 柔光圓 -->
  <circle cx="120" cy="60" r="300" fill="url(#gSky)"/>
  <circle cx="700" cy="420" r="320" fill="url(#gBrand)"/>
  <circle cx="560" cy="30" r="220" fill="url(#gAmber)"/>

  <!-- 點綴環 -->
  <circle cx="640" cy="390" r="150" fill="none" stroke="#EFBEB0" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="150" cy="380" r="90" fill="none" stroke="#bae6fd" stroke-opacity="0.5" stroke-width="2"/>

  <!-- 底部分層波浪（龍蝦/海洋氣質） -->
  <path d="M0 380 Q 100 358 200 372 T 400 372 T 600 372 T 800 372 L 800 450 L 0 450 Z" fill="#F7DED5" fill-opacity="0.5"/>
  <path d="M0 402 Q 120 382 240 396 T 480 396 T 720 396 T 800 396 L 800 450 L 0 450 Z" fill="#EFBEB0" fill-opacity="0.35"/>

  <!-- 學位帽（學院主題，居中留白給卡片標題） -->
  <g transform="rotate(-6 400 205)">
    <!-- 帽沿（菱形） -->
    <path d="M400 148 L524 200 L400 252 L276 200 Z" fill="#AC4730"/>
    <!-- 右側厚度 -->
    <path d="M400 252 L524 200 L524 216 L400 268 Z" fill="#8E3826"/>
    <!-- 左側厚度 -->
    <path d="M276 200 L400 252 L400 268 L276 216 Z" fill="#6f2a1e"/>
    <!-- 頭蓋 -->
    <path d="M344 236 L456 236 L466 272 L334 272 Z" fill="#8E3826"/>
    <!-- 帽頂鈕扣 -->
    <circle cx="400" cy="200" r="8" fill="#F7DED5"/>
    <!-- 流蘇 -->
    <path d="M408 200 Q 468 212 500 246" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
    <circle cx="502" cy="250" r="10" fill="#f59e0b"/>
  </g>

  <!-- 星光點綴 -->
  <path d="M548 118 Q 554 136 572 142 Q 554 148 548 166 Q 542 148 524 142 Q 542 136 548 118 Z" fill="#f59e0b"/>
  <path d="M268 158 Q 271 166 279 169 Q 271 172 268 180 Q 265 172 257 169 Q 265 166 268 158 Z" fill="#C5573C" fill-opacity="0.75"/>
  <circle cx="586" cy="300" r="4" fill="#C5573C" fill-opacity="0.45"/>
  <circle cx="240" cy="300" r="3" fill="#f59e0b" fill-opacity="0.6"/>

  <!-- 水印文字 -->
  <text x="400" y="404" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="20" letter-spacing="8" fill="#C8A79B">龍蝦學院 · DAO 教程</text>
</svg>
