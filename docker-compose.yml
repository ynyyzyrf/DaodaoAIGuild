name: daodao

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/media:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    environment:
      DATABASE_URL: mysql+asyncmy://daodao:daodao@db:3306/daodao
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      AGENT_JWT_SECRET: ${AGENT_JWT_SECRET:-dev-agent-secret-change-me-in-production}
    volumes:
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: daodao
      MYSQL_USER: daodao
      MYSQL_PASSWORD: daodao
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db_data: {}
  media_data: {}
